[project]
name = "layerwise"
version = "0.1.0"
description = "Real-time defect monitoring for L-PBF additive manufacturing"
requires-python = ">=3.11,<3.12"
dependencies = [
    "typer",
    "pyarrow",
    "duckdb",
    "pillow",
    "pyyaml",
    "mlflow",
]

[project.optional-dependencies]
vision = [
    "torch",
    "torchvision",
    "ultralytics",
    "albumentations",
    "opencv-python-headless",
    "numpy",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[project.scripts]
layerwise = "layerwise.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/layerwise"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "slow: full-protocol tests that train a model on the CPU fixture",
]
